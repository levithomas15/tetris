name: Tests & Veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur Schreibrechte aufs Repo nötig — kein Pages-Admin-Recht,
# das der Standard-Token nicht hat.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Logiktests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine-Tests
        run: node test/engine.test.js

  publish:
    name: gh-pages aktualisieren
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html css js icons manifest.webmanifest sw.js _site/
          touch _site/.nojekyll

      - name: Auf gh-pages veröffentlichen
        run: |
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
